name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR branch makes the in-flight run for that branch
# obsolete.  Cancel it instead of letting two full suites race.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default: no job gets a writable GITHUB_TOKEN unless it
# asks for one.  The `coverage` job overrides this with the `id-token: write`
# it needs for Codecov's OIDC upload.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
permissions:
  contents: read

# This workflow checks a change, and only what is fast enough to check a
# change: the Linux unittest shards, the coverage gate, the
# editable-install e2e and the Nix derivation build.  It is the fast lane
# on purpose: a PR needs to turn green in minutes because agent turns
# poll CI to completion.
#
# The native lane moved off this path (issue #749): the macOS app unit
# tests and the macOS install smoke test run in native.yml (nightly on
# main, on merge_group, on demand) and again on every `v*` tag in
# release.yml, which builds and verifies the shipping artifacts (wheel,
# Nix derivation, SWE.app and its DMG).  The Nix build came back here:
# off the PR path it rotted for weeks unseen and then failed the v1.2.3
# tag, and it runs in parallel with the test shards in about the same
# time (~4 minutes), so it costs a PR no wall-clock time.

env:
  # How many jobs each interpreter's suite is split across.  Must match the
  # length of `matrix.shard` below.
  TEST_SHARDS: 2

jobs:
  test:
    name: test (${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One red shard should not cancel the other and hide its failures.
      fail-fast: false
      matrix:
        # Endpoints of the supported range (requires-python = ">=3.11").
        # Since the floor moved to 3.11 there is no version-gated code left
        # in the tree at all: `tomllib` is stdlib throughout and the ISO-8601
        # salvage pass in harness/rate_limits.py behaves the same on every
        # supported interpreter.  These two legs are here to catch stdlib
        # drift across the range, not to cover a branch in our own source.
        #
        # The 3.13 leg runs the suite under coverage instead of plainly, so
        # the suite runs once per interpreter rather than twice on 3.13.
        python-version: ["3.11", "3.13"]
        # 1-based; scripts/run_test_shard.py takes every TEST_SHARDS-th case.
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # The core is stdlib-only, so this only saves the build backend
          # and coverage downloads; keyed on pyproject.toml.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and coverage tooling
        run: pip install -e ".[test]"

      - name: E2e smoke test (installed binary)
        # Run commands against the installed `swe` entry point — NOT
        # PYTHONPATH=src.  This catches stale-install bugs where a new
        # module file exists in the source tree but is invisible to the
        # pip-installed binary (e.g. after switching from a non-editable
        # install).  Each command exercises a different subsystem:
        #   list      → harness registry + rate_limits + session cache
        #   aliases   → harness registry
        #   session   → session parsers + aggregator
        #   models    → models analytics
        #   skills    → skills discovery
        #   mcp list  → mcp formats + cli
        #   providers → providers registry + keys
        #   __complete → completion engine
        # Once per interpreter is enough, so only the first shard runs it.
        if: ${{ matrix.shard == 1 }}
        run: |
          export HOME="$(mktemp -d)"
          swe --help
          swe tags
          swe list
          swe aliases
          swe session
          swe models
          swe skills
          swe mcp list
          swe providers list
          swe __complete list
          mkdir -p "$HOME/.swe/AGENTS_MD"
          printf 'rules.md\n' > "$HOME/.swe/AGENTS_MD/index.txt"
          printf '# Test instructions\n\nKeep changes small.\n' > "$HOME/.swe/AGENTS_MD/rules.md"
          swe instructions build
          swe instructions check
          swe instructions build

      - name: Run unit tests
        if: ${{ matrix.python-version != '3.13' }}
        run: |
          export HOME="$(mktemp -d)"
          python scripts/run_test_shard.py $(( ${{ matrix.shard }} - 1 )) "$TEST_SHARDS"

      - name: Run unit tests under coverage
        # Raw data only; the `coverage` job combines every shard's files
        # and applies the fail_under gate.
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          export HOME="$(mktemp -d)"
          python -m coverage run scripts/run_test_shard.py $(( ${{ matrix.shard }} - 1 )) "$TEST_SHARDS"

      - name: Upload this shard's coverage data
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.*
          # The data files are dotfiles, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    # The fail_under gate in .coveragerc plus the Codecov upload, over the
    # combined data of every 3.13 shard.
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and coverage tooling
        run: pip install -e ".[test]"

      - name: Download every shard's coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and report
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python-3.13
          name: python-3.13
          # Coverage reporting is a nice-to-have. Codecov being unreachable
          # should not mark a run red when every test job passed.
          fail_ci_if_error: false

  session-view:
    # The React session view (app/web-session): typecheck, the token lint,
    # its Vitest suite and a build, then a check that the build matches
    # the bundle committed under src/swe/webapp/static/session. Installs
    # serve that committed copy and never run Node, so a source change
    # without a rebuild (or a rebase that skipped one) fails here.
    name: Session view
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web-session

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up pnpm (the version package.json's packageManager pins)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm --version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Token lint
        run: pnpm lint:tokens

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: The committed bundle matches the build
        run: |
          git status --porcelain -- ../../src/swe/webapp/static/session
          git diff --exit-code -- ../../src/swe/webapp/static/session
          test -z "$(git status --porcelain -- ../../src/swe/webapp/static/session)"

  keeper-survival:
    # A session keeper (src/swe/remote/keeper) holds a running agent and
    # must outlive a restart of the hub's service. On Linux that depends
    # on systemd itself: the hub's unit is stopped with
    # KillMode=control-group, and only a keeper started in its own scope
    # unit is left alone. No unit test can show that, so this runs the
    # real thing against a systemd user manager: a throwaway service
    # built by systemd.build_unit spawns a keeper, the service is
    # restarted and then stopped, and the keeper must still answer.
    # `--control` repeats it without the scope unit and prints what
    # happens then. The macOS half (launchd) is run by hand; see
    # docs/specs/G5-keeper-process.md.
    name: Keeper survives a hub restart (systemd)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Start a systemd user manager for the runner
        # A runner job is not a login session, so no user manager runs
        # until lingering starts one.
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          for _ in $(seq 1 30); do
            systemctl --user show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          systemctl --user show-environment >/dev/null

      - name: Restart the service under a running keeper
        run: python scripts/keeper_survival_check.py --control

  install-script:
    # scripts/install.sh end to end in a container per distro shape.
    # ubuntu:22.04 has no Python at all (the uv bootstrap path);
    # python:3.12-slim has Python but no uv (the venv path).
    name: install.sh (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            prep: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
          - image: python:3.12-slim
            prep: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install and smoke test in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/s" -w /s ${{ matrix.image }} sh -c '
            set -eu
            ${{ matrix.prep }}
            export HOME="$(mktemp -d)"
            sh scripts/install.sh --wheel="dist/$(ls dist | grep .whl$)"
            test_home="$(mktemp -d)"
            HOME="$test_home" "$HOME/.local/bin/swe" --version
            HOME="$test_home" "$HOME/.local/bin/swe" list
          '

  nix:
    # The same derivation check release.yml runs on a tag.  Its checkPhase
    # runs the whole unittest suite inside the Nix build sandbox, which has
    # no /usr/bin/env, nothing in /usr/bin and only the files flake.nix's
    # source filter lists, so it catches a test that leans on the host or
    # on a file the filter leaves out before a release tag does.
    name: Nix flake build and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the package (runs the unittest suite in the sandbox)
        run: nix build --print-build-logs

      - name: Exercise the built binary
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" ./result/bin/swe --help
          HOME="$test_home" ./result/bin/swe init --check

      - name: nix flake check
        run: nix flake check --print-build-logs
