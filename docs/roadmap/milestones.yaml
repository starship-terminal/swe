# Milestones for the session runtime redesign.
# Spec: docs/specs/G1-session-runtime-redesign.md
# Decisions: docs/decisions/0001-session-runtime-redesign.md
#
# G-codes are stable ids: never renumber or reuse one. A new milestone takes the next number.
# status: todo | ready | doing | blocked | done
# tier:   implement-standard | implement-hard
#         (hard = auth, security, a user data store, a wire protocol, process supervision or architecture)
# hub.py is one lane: milestones that own it (G8, G9, G10, G24) run one at a time.
# Two milestones whose owns globs overlap never run at the same time.
# src/swe/webapp/static/session/** is the committed build output of app/web-session.
# No milestone owns it: every milestone that changes app/web-session rebuilds it,
# and rebuilds again after a rebase. CI fails a PR whose committed copy is stale.
# Paths are relative to the repo root.

- id: G1
  title: Roadmap file, spec and decision record
  status: done
  depends_on: []
  owns: ["docs/roadmap/**", "docs/specs/**", "docs/decisions/**"]
  questions: []
  verify: ["python3 scripts/docs_site.py --check"]
  tier: implement-standard
  est_runtime: 20m

