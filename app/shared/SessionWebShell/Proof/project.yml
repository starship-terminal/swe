# Throwaway iPhone harness for milestone G2: one screen with a native
# navigation bar over the session web view, loaded through the
# SessionWebShell scheme handler from Proof/stub_hub.py. Not an app to
# ship; run it with Proof/run-proof.sh. See docs/specs/G2-iphone-webview-proof.md.
name: ShellProof
options:
  bundleIdPrefix: com.swe.proof
packages:
  SessionWebShell:
    path: ..
targets:
  ShellProof:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: SessionWebShell
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shell Proof
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The stub hub is plain http on 127.0.0.1.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swe.proof.shell
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
  ShellProofUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: ShellProof
    info:
      path: UITests/Info.plist
      properties:
        # The tests stop and start the stub hub through its control port.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: ShellProof
schemes:
  ShellProof:
    build:
      targets:
        ShellProof: all
        ShellProofUITests: [test]
    test:
      targets:
        - ShellProofUITests
